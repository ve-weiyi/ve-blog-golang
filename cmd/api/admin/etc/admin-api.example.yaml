Name: admin-api
Host: 0.0.0.0
Port: 9421
Timeout: 5000
# 健康检查
DevServer:
  Enabled: true
  Port: 6061
  HealthPath: "/ping"
  MetricsPath: "/metrics"
  EnableMetrics: true
# 日志配置
Log:
  Mode: file
  Encoding: json
  Path: runtime/admin-api/log
# 文件上传配置
StorageConfig:
  Provider: minio
  Minio:
    Endpoint: minio:9000
    Bucket: blog
    AccessKey: CHANGE_ME
    SecretKey: CHANGE_ME
    Secure: false
    # 图片对外地址即由此域名决定，须与 ingress/minio.yaml 的主机名一致
    CDNDomain: https://minio.veweiyi.cn

RedisConf:
  db: 0
  host: redis
  port: "6379"
  password: CHANGE_ME

# 令牌配置；secret 至少 32 字节，由 Nacos/环境注入，不要提交真实值
TokenConf:
  secret: CHANGE_ME_32_BYTES_MINIMUM_SECRET
  access_token_ttl: 2h
  refresh_token_ttl: 168h      # refresh idle 有效期
  refresh_absolute_ttl: 720h   # refresh 家族绝对有效期

# etcd模式（集群内 etcd，未启用认证）
# AppRpcConf:
#   Etcd:
#     Hosts:
#      - "etcd:2379"
#     Key: "blog/app.rpc"
#   NonBlock: true
#   Timeout: 5000

# 直连模式
AppRpcConf:
  Endpoints:
    - blog-rpc:9120
  Timeout: 5000
